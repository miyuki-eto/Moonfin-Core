<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Moonfin web client for self-hosted media servers">
  <meta name="theme-color" content="#101010">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moonfin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Moonfin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }

    #moonfin-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      transition: opacity 180ms ease-out;
      z-index: 9999;
      pointer-events: none;
    }

    .startup-throbber {
      position: relative;
      /* Match LoadingThrobber.defaultSize before Flutter starts. */
      width: 96px;
      aspect-ratio: 2;
      animation: startup-appear 1200ms ease-in-out both;
    }

    .startup-throbber::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 92%;
      height: 15px;
      background: radial-gradient(ellipse closest-side,
        #fff, rgb(255 255 255 / .5) 22%, rgb(255 255 255 / .12) 52%, transparent);
      /* Keep the beam on its own layer while Flutter starts on the main thread. */
      will-change: transform;
      animation: startup-breathe 4s ease-in-out infinite;
    }

    #moonfin-loader.ready {
      opacity: 0;
    }

    @keyframes startup-appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes startup-breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(.348, .6667); }
      50% { transform: translate(-50%, -50%) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #moonfin-loader { transition: none; }
      .startup-throbber, .startup-throbber::before { animation: none; }
      .startup-throbber::before {
        transform: translate(-50%, -50%) scale(.674, .8333);
        will-change: auto;
      }
    }
  </style>

  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    (function () {
      function isHlsPlaylistUrl(url) {
        if (typeof url !== 'string' || !url) {
          return false;
        }
        var normalized = url.toLowerCase();
        if (normalized.indexOf('.m3u8') !== -1) {
          return true;
        }
        return normalized.indexOf('format=hls') !== -1;
      }

      function shouldTreatAsHls(url, forceHls) {
        return !!forceHls || isHlsPlaylistUrl(url);
      }

      window.MoonfinHlsBridge = {
        // hls.js is preferred whenever MediaSource is available. canPlayType
        // isn't consulted because Chromium reports native HLS support it
        // can't actually deliver (black screen on MPEG-TS segments). Browsers
        // without MSE, like iPhone Safari, fall through to the native
        // video element, which plays HLS natively there.
        canUseHlsJs: function (video, url, forceHls) {
          if (!shouldTreatAsHls(url, forceHls)) {
            return false;
          }
          if (typeof window.Hls === 'undefined') {
            return false;
          }
          if (typeof window.Hls.isSupported !== 'function') {
            return false;
          }
          return !!window.Hls.isSupported();
        },
        attach: function (video, url, forceHls, startPosition, standby, preview) {
          if (!this.canUseHlsJs(video, url, forceHls)) {
            return null;
          }
          const Hls = window.Hls;
          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            startPosition: startPosition > 0 ? startPosition : -1,
            backBufferLength: standby ? 0 : 90,
            maxBufferLength: standby ? 5 : 30,
            maxMaxBufferLength: standby ? 8 : 600,
          });
          if (preview && hls.config.fragLoadPolicy) {
            // Retry a missing first byte while the tune is still waiting.
            // Once a video fragment is buffered, resume the normal policy.
            const normalPolicy = hls.config.fragLoadPolicy;
            hls.config.fragLoadPolicy = {
              default: {
                ...normalPolicy.default,
                maxTimeToFirstByteMs: 4500,
                timeoutRetry: {
                  ...normalPolicy.default.timeoutRetry,
                  maxNumRetry: 1,
                  retryDelayMs: 0,
                },
              },
            };
            const restoreFragmentPolicy = (_, { frag }) => {
              if (frag.type !== 'main' || frag.sn === 'initSegment') return;
              hls.config.fragLoadPolicy = normalPolicy;
              hls.off(Hls.Events.FRAG_BUFFERED, restoreFragmentPolicy);
            };
            hls.on(Hls.Events.FRAG_BUFFERED, restoreFragmentPolicy);
          }
          hls.on(Hls.Events.ERROR, function (_, data) {
            if (data.fatal) hls.moonfinFatalError = true;
          });
          hls.loadSource(url);
          hls.attachMedia(video);
          return hls;
        },
        isViable: function (hls) {
          return !hls.moonfinFatalError;
        },
        playPreview: function (video, hls) {
          if (!hls) return video.play();
          if (!this.isViable(hls)) {
            return Promise.reject(new Error('HLS preview failed'));
          }
          return new Promise(function (resolve, reject) {
            const errorEvent = window.Hls.Events.ERROR;
            const finish = function (complete, value) {
              hls.off(errorEvent, onError);
              complete(value);
            };
            const onError = function (_, data) {
              if (data.fatal) finish(reject, new Error('HLS preview failed'));
            };
            hls.on(errorEvent, onError);
            video.play().then(
              value => finish(resolve, value),
              error => finish(reject, error)
            );
          });
        },
        park: function (hls) {
          hls.moonfinParked = true;
          if (typeof hls.pauseBuffering === 'function') {
            hls.pauseBuffering();
          } else {
            hls.stopLoad();
          }
        },
        promote: function (hls) {
          hls.config.backBufferLength = 90;
          hls.config.maxBufferLength = 30;
          hls.config.maxMaxBufferLength = 600;
          if (hls.moonfinParked) {
            hls.moonfinParked = false;
            if (typeof hls.resumeBuffering === 'function') {
              hls.resumeBuffering();
            } else {
              hls.startLoad();
            }
          }
        },
        destroy: function (hls) {
          if (hls && typeof hls.destroy === 'function') {
            hls.destroy();
          }
        },
      };

    })();
  </script>
</head>
<body>
  <div id="moonfin-loader" role="progressbar" aria-label="Loading">
    <div class="startup-throbber" aria-hidden="true"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
